<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3f8fd6">
<meta name="robots" content="noindex,nofollow">
<title>Tup Duck Jump</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div id="title" class="overlay">
  <div class="card">
    <img src="assets/duck.png" alt="" class="hero">
    <h1>Tup Duck Jump</h1>
    <ul class="how">
      <li><b>長押し</b>で羽ばたきを溜めて、<b>指を離す</b>と羽ばたく</li>
      <li><b>下にスワイプ</b>で緊急回避</li>
      <li>コインや木の実を集めて、敵を<b>ギリギリ</b>でよけるとスコアアップ</li>
    </ul>
    <p class="best">ベストスコア：<span id="best-title">0</span></p>
    <button type="button" id="start-btn" class="btn">スタート</button>
    <p class="loading" id="loading">読み込み中…</p>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="card">
    <h1>ゲームオーバー</h1>
    <p class="score">SCORE：<span id="over-score">0</span></p>
    <p class="sub">飛んだ距離：<span id="over-dist">0</span> m ／ コイン：<span id="over-coins">0</span> C</p>
    <p class="best">ベストスコア：<span id="best-over">0</span></p>
    <button type="button" id="retry-btn" class="btn">もう一度</button>
  </div>
</div>
</div>

<script src="announce.js"></script>
<script src="game.js"></script>
</body>
</html>
